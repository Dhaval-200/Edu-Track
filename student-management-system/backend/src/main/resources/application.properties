# ===================================================================
# Student Management System - Backend Application Configuration
# ===================================================================

server.port=8081

# Spring Datasource Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/student_management_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Application Settings
logging.level.com.sms=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO

# JSON Serialization
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC
