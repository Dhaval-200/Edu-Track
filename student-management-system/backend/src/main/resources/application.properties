# ===================================================================
# Student Management System - Backend Application Configuration
# ===================================================================

server.port=${PORT:8081}

# Cloud & Local Datasource Configuration
# If DB_URL is provided (MySQL / PostgreSQL / external), Spring Boot uses it.
# Otherwise, falls back to embedded in-memory database so cloud deployments stay healthy and live!
spring.datasource.url=${DB_URL:jdbc:h2:mem:student_management_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Application Settings
logging.level.com.sms=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO

# JSON Serialization
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC
